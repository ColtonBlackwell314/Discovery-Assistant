<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D365 Discovery Hub</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<h2 class="visually-hidden">D365 discovery hub: an overview dashboard, discovery notes organized by team into folder-style sections, and an AI chat scoped to that project's notes.</h2>

<div class="app-shell">
  <div class="project-titlebar">
    <button class="btn btn-sm btn-icon" id="sidebarToggle" title="Collapse navigation" aria-label="Collapse navigation"><i class="bi bi-list"></i></button>
    <div class="dropdown flex-grow-1">
      <button class="project-title-btn" id="projectSwitcherBtn">
        <span id="currentProjectLabel">Untitled project</span>
        <i class="bi bi-caret-down-fill project-title-caret"></i>
      </button>
      <div class="dropdown-menu" id="projectDropdownMenu">
        <label class="form-label">Current project name</label>
        <input type="text" id="projectName" placeholder="Client / project name">
        <div style="height:10px"></div>
        <div class="small text-secondary fw-semibold mb-1">Switch to a project</div>
        <div id="projectListContainer"></div>
        <div style="height:8px"></div>
        <button class="btn btn-sm btn-primary w-100" id="newSessionBtn"><i class="bi bi-plus-circle-fill"></i> New project</button>
      </div>
    </div>
    <button class="btn btn-sm maximize-btn" id="maximizeBtn" title="Side panel width is fixed by the browser — open as a full tab for more room" style="display:none">
      <i class="bi bi-arrows-angle-expand"></i> <span class="maximize-btn-label">Open full tab</span>
    </button>
  </div>

  <div class="app-body">
    <div class="app-sidebar" id="appSidebar">
      <div id="navList"></div>
    </div>
    <div class="app-main" id="appMain">
      <div class="split-container" id="splitContainer">
        <div class="split-pane split-pane-primary" id="splitPrimary">
          <div id="sectionBody"></div>
        </div>
        <div class="split-divider" id="splitDivider" style="display:none" title="Drag to resize">
          <div class="split-divider-grip"></div>
        </div>
        <div class="split-pane split-pane-secondary" id="splitSecondary" style="display:none">
          <div class="split-pane-header" id="splitSecondaryHeader">
            <i class="bi" id="splitSecondaryIcon"></i>
            <span id="splitSecondaryTitle"></span>
            <button class="split-pane-close" id="splitSecondaryClose" title="Close split pane"><i class="bi bi-x-lg"></i></button>
          </div>
          <div class="split-pane-body" id="splitSecondaryBody"></div>
        </div>
      </div>
      <div id="snapZoneHint" class="snap-zone-hint" style="display:none"></div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
